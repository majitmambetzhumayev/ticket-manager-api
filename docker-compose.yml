services:
  api:
    build: .
    ports:
      - "8081:8080"
    environment:
      - ConnectionStrings__Default=Host=db;Database=ticketmanager;Username=postgres;Password=postgres
      - ASPNETCORE_ENVIRONMENT=Development
      - AiService__BaseUrl=http://ai-service:8000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - Redis__ConnectionString=redis:6379
    depends_on:
      db:
        condition: service_healthy
  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TICKET_API_BASE_URL=http://api:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    depends_on:
      - api
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=ticketmanager
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./observability/grafana-dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml
      - ./observability/dashboards:/etc/grafana/provisioning/dashboards/files
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
