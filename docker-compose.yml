services:
  api:
    build: .
    ports:
      - "8081:8080"
    environment:
      - ConnectionStrings__Default=Host=db;Database=ticketmanager;Username=postgres;Password=postgres
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      db:
        condition: service_healthy
  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TICKET_API_BASE_URL=http://api:8080
    depends_on:
      - api
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=ticketmanager
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
