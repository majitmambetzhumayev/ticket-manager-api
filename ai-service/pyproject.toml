[project]
name = "ticket-ai-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=1.0",
    "langchain-openai>=0.2",
    "pydantic>=2.9",
    "httpx>=0.27",
    "numpy>=2.1",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
